spring:
  profiles:
    default: local
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  sql:
    init:
      mode: never

jwt:
  issuer: ian-community
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 600
  refresh-token-expiration-seconds: 604800
